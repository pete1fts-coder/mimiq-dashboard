/* ---------- Toast ---------- */
#toast-slot { position: fixed; left: 50%; transform: translateX(-50%); top: calc(0.75rem + env(safe-area-inset-top, 0px)); z-index: 9; width: min(34rem, calc(100% - 2rem)); }
.toast { background: var(--ui-text); color: var(--ui-bg); border-radius: var(--ui-radius-md); padding: 0.5rem 0.5rem 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; box-shadow: 0 0.75rem 2rem rgba(0,0,0,.6); animation: rise var(--ui-dur) var(--ui-ease-out); }
.toast p { min-width: 0; font-weight: 500; }
.toast .ui-btn--secondary { color: var(--ui-bg); box-shadow: inset 0 0 0 1px var(--ui-bg); }
.toast.bad { background: var(--ui-danger-bg); color: var(--ui-text); }
.toast.bad .ui-btn--secondary { color: var(--ui-text); box-shadow: inset 0 0 0 1px var(--ui-text); }
@keyframes rise { from { opacity: 0; transform: translateY(-0.5rem); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; scroll-behavior: auto !important; }
  .skel::after { display: none; }
  .ui-spinner { border-style: dotted; border-color: currentColor; }
  .ui-check path { stroke-dashoffset: 0; }
  .ui-btn.is-pressed { transform: none !important; }
}
</style>

<div id="app">
  <div class="notice" id="notice" hidden></div>
  <header class="masthead">
    <span id="brand"></span>
    <h1 id="screen-title">Script review</h1>
    <span class="who" id="who"></span>
  </header>
  <main id="main"></main>
</div>
<div id="toast-slot" aria-live="polite"></div>
<p class="vh" role="status" aria-live="polite" id="sr"></p>

<script>
const DEMO = null;

/* ---------- tiny spring (pete-ui-library assets/spring.js v1.0, trimmed) ---------- */
const UISpring = (function () {
  const rq = window.matchMedia('(prefers-reduced-motion: reduce)');
  function animate(o) {
    let x = o.from, v = 0, target = o.to, raf = null, last = null, done = false;
    const k = o.stiffness || 220, c = o.damping || 15;
    const finish = () => { done = true; raf = null; x = target; o.onUpdate(x); };
    function step(now) {
      if (last == null) last = now;
      const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
      for (let i = 0, h = dt / 4; i < 4; i++) { v += (-k * (x - target) - c * v) * h; x += v * h; }
      if (Math.abs(v) < 1 && Math.abs(x - target) < 0.1) return finish();
      o.onUpdate(x); raf = requestAnimationFrame(step);
    }
    if (rq.matches) setTimeout(finish, 0); else raf = requestAnimationFrame(step);
    return { get isDone() { return done; }, retarget(t) { target = t; if (done) { done = false; last = null; raf = requestAnimationFrame(step); } }, stop() { if (raf) cancelAnimationFrame(raf); done = true; } };
  }
  return { animate, reduced: () => rq.matches };
})();

/* ---------- words ---------- */
const W = Object.assign({
  STAGE: { a_unaware: 'Unaware', b_problem_aware: 'Problem aware', c_comparing: 'Comparing' },
  ROLE: { hook: 'Hook', story: 'Story', answer: 'Answer', closing: 'Closing' },
  SPEAKER: { character: 'She says', narrator: 'Narrator', brenda: 'Expert' },
  SHOT: [['shot_intent', 'Intent'], ['shot_subject_action', 'Subject and action'], ['shot_frame', 'Frame'], ['shot_optics', 'Optics'], ['shot_camera', 'Camera'], ['shot_performance', 'Performance'], ['shot_light_space', 'Light and space'], ['shot_continuity', 'Continuity'], ['shot_sound', 'Sound']],
  ERR: {
    stale: s => 'Someone already decided this script' + (s ? ' (it is now ' + s + ')' : '') + '. The queue is reloaded.',
    busy: () => 'The sheet is busy. Try again in a moment.',
    test_rows_only: () => 'Only test rows can be decided while MIMIQ is in test mode.',
    undo_expired: () => 'Too late to undo. Ask for the row to be reset in the sheet.',
    note_needed: () => 'Write what should change first.',
    unauthorized: () => 'Your code was not accepted. Sign in again.',
    demo_fail: () => 'Not saved: the sheet did not answer (a test failure you switched on). Nothing changed. Try again.',
    _: () => 'Not saved: the sheet did not answer. Nothing changed. Try again.'
  }
}, CLIENT.words || {});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nice = s => String(s || '').replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
const words = s => String(s || '').trim().split(/\s+/).filter(Boolean).length;
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const wide = () => window.matchMedia('(min-width: 60em)').matches;
const errText = e => (W.ERR[e && e.code] || W.ERR._)(e && e.status);
const say = t => { const sr = document.getElementById('sr'); sr.textContent = ''; setTimeout(() => { sr.textContent = t; }, 30); };

/* ---------- storage (per viewer convenience only; works without it) ---------- */
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- API: live through the Netlify function, or demo in memory ---------- */
let demoDb = null, failNext = false;
const api = {
  code: store.get('mimiq_code') || '',
  async call(action, payload) {
    if (!CLIENT.api) return demoCall(action, payload || {});
    let res, data;
    try {
      res = await fetch(CLIENT.api, { method: 'POST', headers: { 'content-type': 'application/json', 'x-mimiq-reviewer': api.code }, body: JSON.stringify(Object.assign({ action }, payload)) });
      data = await res.json();
    } catch (e) { throw { code: 'network' }; }
    if (res.status === 401) throw { code: 'unauthorized' };
    if (!data.ok) throw { code: data.error, status: data.status };
    return data;
  }
};
function demoCall(action, p) {
  return new Promise((resolve, reject) => setTimeout(() => {
    const db = demoDb;
    if (action === 'queue') return resolve({ ok: true, reviewer: CLIENT.demoReviewer, items: db.queue.filter(q => db.scripts[q.post_id].post.status === 'Script Review') });
    if (action === 'script') return resolve(JSON.parse(JSON.stringify(db.scripts[p.post_id])));
    if (failNext) return reject({ code: 'demo_fail' });
    const s = db.scripts[p.post_id];
    if (action === 'decide') {
      if (s.post.status !== 'Script Review') return reject({ code: 'stale', status: s.post.status });
      if (p.decision === 'amend' && !p.note) return reject({ code: 'note_needed' });
      if (p.hook_n != null) { s.hooks.forEach(h => { h.picked = Number(h.n) === p.hook_n ? 'Y' : 'N'; }); s.slides[0].headline = s.hooks.find(h => Number(h.n) === p.hook_n).headline; }
      s.post.status = { approve: 'Script Approved', amend: 'Script Amend Requested', reject: 'Script Rejected' }[p.decision];
      return resolve({ ok: true, status: s.post.status });
    }
    if (action === 'reopen') { s.post.status = 'Script Review'; return resolve({ ok: true, status: 'Script Review' }); }
  }, CLIENT.demoLatencyMs || 450));
}

/* ---------- state ---------- */
let S = {};
function reset() {
  demoDb = DEMO ? JSON.parse(JSON.stringify(DEMO)) : null;
  S = { queue: null, openId: null, script: null, tab: 'story', hookN: null, panel: null, reviewer: CLIENT.api ? store.get('mimiq_name') : CLIENT.demoReviewer, err: '' };
}

/* ---------- frame ---------- */
function renderFrame() {
  document.title = (CLIENT.product || 'MIMIQ') + ' Script Review';
  document.getElementById('brand').innerHTML = CLIENT.logo ? '<img src="' + esc(CLIENT.logo) + '" alt="' + esc(CLIENT.name) + '">' : '<span class="wordmark">' + esc(CLIENT.wordmark || CLIENT.name) + '</span>';
  const n = document.getElementById('notice');
  if (!CLIENT.api) {
    n.hidden = false;
    n.innerHTML = '<p><strong>Demo</strong> on the sheet\'s script for ' + esc(DEMO.queue.map(q => q.post_id).join(', ')) + ', copied ' + esc(DEMO.as_of) + '. Nothing is written to the sheet.</p>' +
      '<div class="ctl"><button type="button" class="switch" role="switch" aria-checked="' + failNext + '" id="fail"><span class="track"><span class="knob"></span></span>Make the next save fail</button>' +
      '<button type="button" class="ui-btn ui-btn--secondary ui-btn--small" id="reset">Start over</button></div>';
  }
  document.getElementById('who').innerHTML = S.reviewer ? '<span>Reviewing as <b>' + esc(S.reviewer) + '</b></span>' + (CLIENT.api ? '<button type="button" class="ui-btn ui-btn--quiet ui-btn--small" id="signout">Sign out</button>' : '') : '';
}

/* ---------- sign-in (live only) ---------- */
function renderSignin(errMsg) {
  document.getElementById('main').innerHTML =
    '<form class="signin" id="signin-form" novalidate><h2>Sign in to review</h2><p>Use the reviewer code you were given. It stays in this browser tab only.</p>' +
    '<label for="code">Reviewer code</label><div class="field" id="code-field"><input id="code" name="password" type="password" autocomplete="current-password" required' + (errMsg ? ' aria-invalid="true" aria-describedby="code-err"' : '') + '>' +
    '<button type="button" class="ui-btn ui-btn--secondary ui-btn--small" id="show" aria-pressed="false">Show</button></div>' +
    (errMsg ? '<p class="err" id="code-err" role="alert">' + esc(errMsg) + '</p>' : '') +
    '<button type="submit" class="ui-btn ui-btn--primary" id="signin-btn" data-state="idle"><span class="ui-btn__label">Sign in</span><span class="ui-btn__busy" aria-hidden="true"><span class="ui-spinner"></span>Checking</span><span class="ui-btn__done" aria-hidden="true">Signed in</span></button></form>';
  const f = document.getElementById('code-field');
  if (errMsg) { f.classList.remove('shake'); void f.offsetWidth; if (!UISpring.reduced()) f.classList.add('shake'); }
  document.getElementById('code').focus();
}

/* ---------- main layout ---------- */
function renderShell() {
  document.getElementById('main').innerHTML =
    '<div class="shell" id="shell" data-view="' + (S.openId && !wide() ? 'review' : 'queue') + '">' +
      '<section class="pane queue" aria-labelledby="queue-title"><h2 id="queue-title">Scripts to review</h2><p class="sub" id="queue-sub"></p><div class="rows" id="rows" aria-busy="true"></div></section>' +
      '<section class="pane review" id="review"></section>' +
    '</div>';
}
function skelRows(n) { return Array.from({ length: n }, () => '<div class="skel-row" aria-hidden="true"><span class="skel" style="height:18px;width:85%"></span><span class="skel" style="height:12px;width:55%"></span><span class="skel" style="height:22px;width:40%"></span></div>').join(''); }

function renderQueue() {
  const rows = document.getElementById('rows'), sub = document.getElementById('queue-sub');
  if (!rows) return;
  if (S.queue == null) { sub.textContent = 'Loading…'; rows.innerHTML = skelRows(2); rows.setAttribute('aria-busy', 'true'); return; }
  rows.setAttribute('aria-busy', 'false');
  const n = S.queue.length;
  sub.textContent = n === 0 ? 'Nothing waiting.' : (n === 1 ? '1 script is waiting for you.' : n + ' scripts are waiting for you.');
  rows.innerHTML = n ? S.queue.map(q =>
    '<div class="row-wrap" data-wrap="' + esc(q.post_id) + '"><div><button type="button" class="row fade-in" data-open="' + esc(q.post_id) + '"' + (q.post_id === S.openId ? ' aria-current="true"' : '') + '>' +
      '<span class="t">' + esc(q.hook || q.post_id) + '</span>' +
      '<span class="m">' + esc(q.post_id) + ', ' + esc(nice(q.surface)) + (q.slides ? ', ' + q.slides + ' slides' : '') + ', ' + esc(q.language) + '</span>' +
      '<span class="tags"><span class="tag gold">' + esc(nice(q.pattern)) + '</span><span class="tag">' + esc(nice(q.mood)) + '</span>' + (q.pending_brenda ? '<span class="tag warn">Pending ' + esc(CLIENT.expert || 'expert') + '</span>' : '') + '</span>' +
    '</button></div></div>').join('')
    : '<p class="empty fade-in">' + esc(CLIENT.words && CLIENT.words.empty || 'No scripts are waiting. New scripts land here after the Script Writer runs.') + '</p>';
}

function renderReview() {
  const el = document.getElementById('review'); if (!el) return;
  if (!S.openId) { el.innerHTML = '<div class="head"><h2>' + (S.queue && S.queue.length ? 'Pick a script from the list' : 'All caught up') + '</h2><p class="topic">' + (S.queue && S.queue.length ? 'Its story, hooks and caption open here.' : 'Nothing to review right now.') + '</p></div>'; return; }
  if (!S.script) {
    el.setAttribute('aria-busy', 'true');
    el.innerHTML = '<div class="head" aria-hidden="true"><span class="skel" style="height:12px;width:9rem"></span><span class="skel" style="height:34px;width:80%"></span><span class="skel" style="height:14px;width:60%"></span></div>' +
      '<div class="tabbar" aria-hidden="true" style="border:0"><span class="skel" style="height:40px;width:18rem"></span></div><div class="panel" aria-hidden="true">' + skelRows(3) + '</div>';
    return;
  }
  el.removeAttribute('aria-busy');
  const sc = S.script, p = sc.post;
  const judge = sc.hooks.find(h => h.picked === 'Y');
  const pickN = S.hookN != null ? S.hookN : (judge ? Number(judge.n) : null);
  const pick = sc.hooks.find(h => Number(h.n) === pickN);
  const tabs = [['story', 'Story', sc.slides.length], ['hooks', 'Hooks', sc.hooks.length], ['caption', 'Caption', null]];
  el.innerHTML =
    '<button type="button" class="ui-btn ui-btn--quiet back" id="back">Back to the list</button>' +
    '<div class="head fade-in"><span class="kicker">' + esc(p.post_id) + ' · ' + esc(nice(p.surface)) + ', ' + sc.slides.length + ' slides · ' + esc(p.language) + '</span>' +
      '<h2 id="post-title" tabindex="-1">' + esc(pick ? pick.headline : sc.slides[0].headline) + '</h2>' +
      '<p class="topic">' + esc(p.topic) + '</p>' +
      '<div class="tags"><span class="tag gold">' + esc(nice(p.pattern)) + '</span><span class="tag">Angle: ' + esc(nice(p.angle)) + '</span><span class="tag">Mood: ' + esc(nice(p.mood)) + '</span><span class="tag">' + esc(W.STAGE[p.stage] || nice(p.stage)) + '</span><span class="tag">' + (p.service ? 'Service: ' + esc(p.service) : 'No service named') + '</span>' + (p.pending_brenda ? '<span class="tag warn">Pending ' + esc(CLIENT.expert || 'expert') + '</span>' : '') + '</div></div>' +
    '<div class="tabbar" role="tablist" aria-label="Script parts" id="tabbar"><span class="bar" aria-hidden="true"></span>' +
      tabs.map(([k, label, n]) => '<button type="button" class="tab" role="tab" id="tab-' + k + '" aria-controls="panel-' + k + '" aria-selected="' + (S.tab === k) + '" tabindex="' + (S.tab === k ? 0 : -1) + '">' + label + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>').join('') + '</div>' +
    '<div class="panel" role="tabpanel" id="panel-story" aria-labelledby="tab-story"' + (S.tab === 'story' ? '' : ' hidden') + '>' + storyHtml(sc, pick, judge) + '</div>' +
    '<div class="panel" role="tabpanel" id="panel-hooks" aria-labelledby="tab-hooks"' + (S.tab === 'hooks' ? '' : ' hidden') + '>' + hooksHtml(sc, pickN, judge) + '</div>' +
    '<div class="panel" role="tabpanel" id="panel-caption" aria-labelledby="tab-caption"' + (S.tab === 'caption' ? '' : ' hidden') + '>' + captionHtml(sc) + '</div>' +
    decisionHtml(p, pick, judge);
  wireTabs();
}

function storyHtml(sc, pick, judge) {
  const cast = sc.slides[0] && sc.slides[0].cast;
  return (cast ? '<p class="cast"><b>Cast:</b> ' + esc(cast) + '</p>' : '') + sc.slides.map((s, i) => {
    const head = i === 0 && pick ? pick.headline : s.headline;
    const changed = i === 0 && pick && judge && pick.n !== judge.n;
    const line = s.dialogue || s.narration;
    const shot = W.SHOT.filter(([k]) => s[k]);
    return '<article class="beat"><span class="num" aria-hidden="true">' + esc(s.n) + '</span><div class="body">' +
      '<div class="meta"><span class="tag gold">' + esc(W.ROLE[s.role] || nice(s.role)) + '</span>' + (s.emotion ? '<span class="tag">' + esc(nice(s.emotion)) + '</span>' : '') + '</div>' +
      '<h4><span class="vh">Slide ' + esc(s.n) + ': </span>' + esc(head) + (changed ? '<span class="changed">your hook</span>' : '') + '</h4>' +
      (line ? '<blockquote class="line"><span class="who">' + esc(s.speaker === 'brenda' ? (CLIENT.expert || W.SPEAKER.brenda) : (W.SPEAKER[s.speaker] || nice(s.speaker))) + '</span>' + esc(line) + '</blockquote>' : '') +
      (s.beat ? '<p class="what">' + esc(s.beat) + '</p>' : '') +
      (s.on_slide_words ? '<p class="onslide"><span class="k">Fact on the slide</span>' + esc(s.on_slide_words) + (s.source_url ? ' <a href="' + esc(s.source_url) + '" target="_blank" rel="noopener">' + esc(host(s.source_url)) + '<span class="vh"> (opens in a new tab)</span></a>' : '') + '</p>' : '') +
      (shot.length ? '<details class="shot"><summary>Shot direction (' + shot.length + ' fields)</summary><dl>' + shot.map(([k, l]) => '<dt>' + l + '</dt><dd>' + esc(s[k]) + '</dd>').join('') + '</dl></details>' : '') +
    '</div></article>';
  }).join('');
}

function hooksHtml(sc, pickN, judge) {
  const max = CLIENT.hookMax || 42;
  return '<div class="hooks-head"><span>The pick goes on slide 1. Hooks over ' + max + ' characters do not fit the slide.</span>' + (judge ? '<span>Judge picked ' + esc(judge.n) + '</span>' : '') + '</div>' +
    '<fieldset><legend class="vh">Pick the hook for slide 1</legend>' + sc.hooks.map(h => {
      const len = h.headline.length, over = len > max, on = Number(h.n) === pickN;
      return '<label class="hook' + (on ? ' is-on' : '') + (over ? ' is-off' : '') + '"><input type="radio" name="hook" value="' + esc(h.n) + '"' + (on ? ' checked' : '') + (over ? ' disabled aria-describedby="len-' + esc(h.n) + '"' : '') + '>' +
        '<span><span class="txt">' + esc(h.headline) + '</span><span class="m"><span>' + esc(h.n) + '. ' + esc(nice(h.hook_method)) + '</span><span id="len-' + esc(h.n) + '"' + (over ? ' class="over"' : '') + '>' + len + ' characters' + (over ? ', too long for the slide' : '') + '</span>' + (judge && h.n === judge.n ? '<span>Judge\'s pick</span>' : '') + '</span></span></label>';
    }).join('') + '</fieldset>';
}

function captionHtml(sc) {
  return '<p class="count-note">' + words(sc.caption) + ' words · ' + sc.caption.length + ' characters · the last line is set by code</p><p class="caption">' + esc(sc.caption) + '</p>';
}

function btn(id, cls, label, busy, done) {
  return '<button type="' + (id === 'approve' ? 'button' : 'submit') + '" class="ui-btn ' + cls + '" id="' + id + '" data-state="idle"><span class="ui-btn__label">' + label + '</span><span class="ui-btn__busy" aria-hidden="true"><span class="ui-spinner"></span>' + busy + '</span><span class="ui-btn__done" aria-hidden="true"><svg class="ui-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' + done + '</span></button>';
}
function decisionHtml(p, pick, judge) {
  const err = S.err ? '<p class="err" role="alert">' + esc(S.err) + '</p>' : '';
  if (p.status !== 'Script Review') return '<div class="decide"><p class="hint">This script is at ' + esc(p.status) + '. Nothing to decide.</p></div>';
  if (S.panel === 'amend') return '<form class="decide" id="amend-form"><label for="note">What should change?</label><textarea id="note" placeholder="For example: slide 3 says the same thing as slide 2."></textarea>' + err + '<div class="pair">' + btn('amend-go', 'ui-btn--primary', 'Send for one rewrite', 'Sending', 'Sent') + '<button type="button" class="ui-btn ui-btn--secondary" data-panel="">Keep reviewing</button></div></form>';
  if (S.panel === 'reject') return '<form class="decide" id="reject-form"><label for="note">Reject this script? WF2 will never draw it. The row stays in the sheet as Script Rejected.</label><textarea id="note" placeholder="Reason, if you want to leave one"></textarea>' + err + '<div class="pair">' + btn('reject-go', 'ui-btn--danger', 'Reject script', 'Saving', 'Rejected') + '<button type="button" class="ui-btn ui-btn--secondary" data-panel="">Keep reviewing</button></div></form>';
  const mine = pick && judge && pick.n !== judge.n;
  return '<div class="decide"><div class="row2">' + btn('approve', 'ui-btn--primary approve', 'Approve script', 'Saving', 'Approved') +
    '<div class="others"><button type="button" class="ui-btn ui-btn--secondary" data-panel="amend">Amend</button><button type="button" class="ui-btn ui-btn--secondary" data-panel="reject">Reject</button></div></div>' + err +
    '<p class="hint">' + (pick ? 'Approves with ' + (mine ? '<b>your hook ' + esc(pick.n) + '</b>' : 'the judge\'s hook ' + esc(pick.n)) + ' on slide 1. ' : '') + 'Undo stays open for 8 seconds after it saves.</p></div>';
}

/* ---------- tab bar with sliding indicator (library: tab-bar-sliding-pill) ---------- */
let bar = { L: 0, R: 0, sL: null, sR: null };
function wireTabs() {
  const tb = document.getElementById('tabbar'); if (!tb) return;
  const ind = tb.querySelector('.bar');
  const sel = tb.querySelector('[aria-selected="true"]');
  const edges = t => { const b = tb.getBoundingClientRect(), r = t.getBoundingClientRect(); return { l: r.left - b.left, r: r.right - b.left }; };
  const draw = () => { ind.style.width = Math.max(0, bar.R - bar.L) + 'px'; ind.style.transform = 'translateX(' + bar.L + 'px)'; };
  const e = edges(sel);
  if (bar.R === 0 || !bar.moving) { bar.L = e.l; bar.R = e.r; draw(); }
  bar.draw = draw; bar.edges = edges; bar.ind = ind;
}
function slideBar(toTab) {
  const e = bar.edges(toTab), right = e.l > bar.L;
  const go = (which, to, cfg) => UISpring.animate({ from: bar[which], to, stiffness: cfg[0], damping: cfg[1], onUpdate: v => { bar[which] = v; bar.draw(); } });
  bar.moving = true;
  // Leading edge first, trailing edge 70 ms later: the bar stretches toward the new tab, then shrinks to fit it.
  go(right ? 'R' : 'L', right ? e.r : e.l, [380, 26]);
  setTimeout(() => { go(right ? 'L' : 'R', right ? e.l : e.r, [260, 24]); setTimeout(() => { bar.moving = false; }, 600); }, UISpring.reduced() ? 0 : 70);
}
function selectTab(key, focus) {
  if (S.tab === key) return;
  S.tab = key;
  document.querySelectorAll('#tabbar [role="tab"]').forEach(t => {
    const on = t.id === 'tab-' + key;
    t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1;
    document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    if (on) { if (focus) t.focus(); slideBar(t); }
  });
}

/* ---------- button states (library: primary-button runAsync) ---------- */
function runAsync(b, task) {
  if (!b || b.getAttribute('aria-busy') === 'true') return Promise.resolve('ignored');
  b.style.width = b.offsetWidth + 'px';
  b.setAttribute('aria-busy', 'true'); b.setAttribute('aria-disabled', 'true'); b.dataset.state = 'loading';
  say('Saving');
  const unlock = () => { b.dataset.state = 'idle'; b.removeAttribute('aria-busy'); b.removeAttribute('aria-disabled'); b.style.width = ''; };
  return task().then(r => { b.dataset.state = 'success'; return new Promise(res => setTimeout(() => res(r), UISpring.reduced() ? 300 : 900)); }, e => { unlock(); throw e; });
}
document.addEventListener('pointerdown', e => { const b = e.target.closest('.ui-btn'); if (b && !b.disabled && b.getAttribute('aria-disabled') !== 'true') b.classList.add('is-pressed'); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, () => document.querySelectorAll('.ui-btn.is-pressed').forEach(b => b.classList.remove('is-pressed')), true));

/* ---------- data flow ---------- */
async function loadQueue() {
  S.queue = null; renderQueue();
  try {
    const d = await api.call('queue');
    if (d.reviewer) { S.reviewer = d.reviewer; store.set('mimiq_name', d.reviewer); renderFrame(); }
    S.queue = d.items;
    if (S.openId && !S.queue.find(q => q.post_id === S.openId)) S.openId = null;
    if (!S.openId && S.queue.length && wide()) S.openId = S.queue[0].post_id;
    renderQueue();
    if (S.openId) openScript(S.openId); else renderReview();
  } catch (e) { handleErr(e, true); }
}
async function openScript(id) {
  S.openId = id; S.script = null; S.hookN = null; S.panel = null; S.err = ''; S.tab = 'story'; bar.R = 0;
  document.getElementById('shell').dataset.view = 'review';
  renderQueue(); renderReview();
  try {
    const d = await api.call('script', { post_id: id });
    if (S.openId !== id) return;
    S.script = d; renderReview();
    if (!wide()) window.scrollTo(0, 0);
  } catch (e) { handleErr(e); }
}
function handleErr(e, queueLevel) {
  if (e && e.code === 'unauthorized') { api.code = ''; store.set('mimiq_code', null); S.reviewer = null; renderFrame(); renderSignin(errText(e)); return; }
  toast(errText(e), null, true);
  if (queueLevel) { S.queue = S.queue || []; renderQueue(); }
}
async function decide(kind) {
  const p = S.script.post, judge = S.script.hooks.find(h => h.picked === 'Y');
  const note = (document.getElementById('note') || {}).value || '';
  if (kind === 'amend' && !note.trim()) { S.err = W.ERR.note_needed(); renderReview(); document.getElementById('note').focus(); return; }
  const payload = { post_id: p.post_id, decision: kind, note: note.trim() };
  if (S.hookN != null && (!judge || S.hookN !== Number(judge.n))) payload.hook_n = S.hookN;
  const b = document.getElementById(kind === 'approve' ? 'approve' : kind + '-go');
  S.err = '';
  try {
    const r = await runAsync(b, () => api.call('decide', payload));
    const id = p.post_id;
    say(id + ' ' + r.status);
    // Row folds away and the rest glide up (library: row-delete-smooth-collapse), then the next script opens.
    const wrap = document.querySelector('[data-wrap="' + CSS.escape(id) + '"]');
    if (wrap) wrap.classList.add('is-gone');
    setTimeout(() => {
      S.queue = S.queue.filter(q => q.post_id !== id);
      const next = S.queue[0];
      S.openId = null; S.script = null;
      renderQueue();
      if (next && wide()) openScript(next.post_id); else { document.getElementById('shell').dataset.view = 'queue'; renderReview(); }
      toast(id + ': ' + r.status + '.', () => undo(id));
    }, UISpring.reduced() ? 0 : 320);
  } catch (e) {
    if (e && e.code === 'stale') { toast(errText(e), null, true); loadQueue(); return; }
    if (e && e.code === 'unauthorized') return handleErr(e);
    S.err = errText(e);
    const keep = (document.getElementById('note') || {}).value;
    renderReview();
    const n = document.getElementById('note'); if (n && keep) n.value = keep;
    const again = document.getElementById(kind === 'approve' ? 'approve' : kind + '-go'); if (again) again.focus();
  }
}
async function undo(id) {
  try { await api.call('reopen', { post_id: id }); toast(id + ' is back at Script Review.'); await loadQueue(); openScript(id); }
  catch (e) { toast(errText(e), null, true); }
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undoFn, bad) {
  clearTimeout(toastTimer);
  const slot = document.getElementById('toast-slot');
  slot.innerHTML = '<div class="toast' + (bad ? ' bad' : '') + '" role="' + (bad ? 'alert' : 'status') + '"><p>' + esc(msg) + '</p>' + (undoFn ? '<button type="button" class="ui-btn ui-btn--secondary ui-btn--small" id="undo">Undo</button>' : '<button type="button" class="ui-btn ui-btn--secondary ui-btn--small" id="toast-x">Close</button>') + '</div>';
  if (undoFn) document.getElementById('undo').onclick = () => { slot.innerHTML = ''; undoFn(); };
  else document.getElementById('toast-x').onclick = () => { slot.innerHTML = ''; };
  if (!bad) toastTimer = setTimeout(() => { slot.innerHTML = ''; }, 8000);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
  if (b.id === 'fail') { failNext = !failNext; b.setAttribute('aria-checked', failNext); return; }
  if (b.id === 'reset') { reset(); boot(); return; }
  if (b.id === 'signout') { api.code = ''; store.set('mimiq_code', null); store.set('mimiq_name', null); S.reviewer = null; renderFrame(); renderSignin(); return; }
  if (b.id === 'show') { const i = document.getElementById('code'); const on = i.type === 'password'; i.type = on ? 'text' : 'password'; b.textContent = on ? 'Hide' : 'Show'; b.setAttribute('aria-pressed', on); return; }
  if (b.dataset.open) { openScript(b.dataset.open); return; }
  if (b.id === 'back') { document.getElementById('shell').dataset.view = 'queue'; S.openId = null; S.script = null; renderQueue(); renderReview(); return; }
  if (b.getAttribute('role') === 'tab') { selectTab(b.id.slice(4), false); return; }
  if ('panel' in b.dataset) { S.panel = b.dataset.panel || null; S.err = ''; renderReview(); const n = document.getElementById('note'); if (n) n.focus(); else document.getElementById('approve').focus(); return; }
  if (b.id === 'approve') { decide('approve'); return; }
});
document.addEventListener('change', e => {
  if (e.target.name === 'hook') {
    S.hookN = Number(e.target.value);
    document.querySelectorAll('.hook').forEach(l => l.classList.toggle('is-on', l.querySelector('input').checked));
    const sc = S.script, pick = sc.hooks.find(h => Number(h.n) === S.hookN), judge = sc.hooks.find(h => h.picked === 'Y');
    document.getElementById('post-title').textContent = pick.headline;
    document.getElementById('panel-story').innerHTML = storyHtml(sc, pick, judge);
    const old = document.querySelector('.decide'); if (old) old.outerHTML = decisionHtml(sc.post, pick, judge);
    say('Hook ' + S.hookN + ' will go on slide 1 when you approve.');
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'amend-form') return decide('amend');
  if (e.target.id === 'reject-form') return decide('reject');
  if (e.target.id === 'signin-form') {
    const v = document.getElementById('code').value.trim();
    if (!v) return renderSignin('Enter your reviewer code.');
    api.code = v; store.set('mimiq_code', v);
    const b = document.getElementById('signin-btn');
    try { await runAsync(b, () => api.call('queue')); renderShell(); loadQueue(); }
    catch (err) { api.code = ''; store.set('mimiq_code', null); renderSignin(err && err.code === 'unauthorized' ? 'That code was not accepted.' : errText(err)); }
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.getAttribute && t.getAttribute('role') === 'tab') {
    const tabs = [...document.querySelectorAll('#tabbar [role="tab"]')], i = tabs.indexOf(t);
    let n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % tabs.length; else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length; else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = tabs.length - 1;
    if (n != null) { e.preventDefault(); selectTab(tabs[n].id.slice(4), true); }
  }
  if (e.key === 'Escape' && S.panel) { S.panel = null; S.err = ''; renderReview(); const a = document.getElementById('approve'); if (a) a.focus(); }
});
window.addEventListener('resize', () => { const tb = document.getElementById('tabbar'); if (tb && !bar.moving) { const s = tb.querySelector('[aria-selected="true"]'); const e = bar.edges(s); bar.L = e.l; bar.R = e.r; bar.draw(); } });

function boot() {
  renderFrame();
  if (CLIENT.api && !api.code) return renderSignin();
  renderShell(); loadQueue();
}
reset(); boot();
</script>
</body></html>
